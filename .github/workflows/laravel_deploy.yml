name: Laravel CI/CD to cPanel

on:
  push:
    branches:
      - develop-3 # Deploy ketika push ke branch ini

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # --- [ CI: Dependency Setup and Build ] ---

      # 1. Setup PHP dan Composer
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Sesuaikan dengan versi PHP di cPanel
          extensions: imagick, gd, xdebug
          coverage: none

      # 2. Install Dependencies PHP (Composer)
      - name: 📦 Composer Install
        run: composer install --prefer-dist --no-dev --no-interaction

      # 3. Setup Node dan Build Assets
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install & Build Assets
        run: |
          npm install
          npm run build # Asumsikan 'npm run build' ada di package.json Anda

      # --- [ CD: Deployment via Rsync (Rsync adalah SSH yang efisien) ] ---

      - name: 🚀 Deploy via Rsync to cPanel
        uses: easingthemes/ssh-deploy@main # Gunakan action yang berbeda dan aktif
        with:
          # SSH Credentials dari GitHub Secrets
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

          # Source dan Target
          SOURCE: "." # Mengirim semua file dari root
          TARGET: ${{ secrets.DEPLOY_PATH }}

          # Exclude files/folders
          EXCLUDE: ".git,.github,storage,vendor,node_modules"

          # Menggunakan Rsync (penting untuk transfer efisien)
          ARGS: "-avz --delete --exclude=.env" # --exclude=.env agar file .env server tidak tertimpa

      # --- [ CD: Post-Deployment Commands (SSH) ] ---

      - name: 📝 Run Post-Deployment Commands (Migrasi, Cache)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pindah ke direktori deployment
            cd ${{ secrets.DEPLOY_PATH }}

            # 1. Jalankan Migrasi Database
            # /usr/local/bin/php artisan migrate --force

            # 2. Hapus Cache
            /usr/local/bin/php artisan cache:clear
            /usr/local/bin/php artisan view:clear
            /usr/local/bin/php artisan route:clear
            /usr/local/bin/php artisan config:cache # Opsional: Mengoptimalkan konfigurasi

            # 3. Izin Folder Storage
            chmod -R 775 storage bootstrap/cache

            /bin/echo "Deployment Laravel Selesai dan Post-Deployment Tasks Dieksekusi."
